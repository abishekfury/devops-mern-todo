services:
  mongo:
    image: "mongo"
    ports:
      - "3000:27017"

  backend:
    build: './backend'
    ports:
      - "5001:5000"
    depends_on:
      - mongo
    env_file:
      - "./backend/.env.prod"

  frontend:
    build: './frontend'
    ports:
      - "3001:3001"
    depends_on:
      - backend
    env_file:
      - "./frontend/.env.prod"